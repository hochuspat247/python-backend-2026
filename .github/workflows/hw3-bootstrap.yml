name: Build HW3 and capture Grafana

on:
  push:
    branches:
      - hw3-monitoring
    paths:
      - hw3-submission.zip

permissions:
  contents: write

jobs:
  build-homework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract homework
        run: |
          unzip -q hw3-submission.zip
          rm hw3-submission.zip

      - name: Start monitoring stack
        working-directory: hw3
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://localhost:8000/health; do sleep 2; done'
          timeout 120 bash -c 'until curl --fail --silent http://localhost:9090/-/ready; do sleep 2; done'
          timeout 120 bash -c 'until curl --fail --silent http://localhost:3000/api/health; do sleep 2; done'

      - name: Generate API traffic
        run: python hw3/load_test.py --seconds 45

      - name: Install browser
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: Capture Grafana dashboard
        run: python hw3/capture_dashboard.py

      - name: Commit homework
        run: |
          rm .github/workflows/hw3-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Docker monitoring for Shop API"
          git push

      - name: Show container logs on failure
        if: failure()
        working-directory: hw3
        run: docker compose logs
